services:
  - type: web
    name: ajaia-docs-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run prisma:generate -w backend && npm run build -w backend
    startCommand: npm run start -w backend
    preDeployCommand: npm run prisma:migrate:deploy -w backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
